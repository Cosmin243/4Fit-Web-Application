<section class="py-20">
  <div class="container">
    <div class="text-center mb-16">
      <p class="section-eyebrow">Despre noi</p>
      <h1 class="text-4xl md:text-5xl font-bold">Echipa noastra</h1>
      <p class="text-muted-foreground mt-4 max-w-2xl mx-auto">Antrenorii sunt incarcati din baza de date si apar aici cand sunt activi.</p>
    </div>

    <p *ngIf="eroare" class="text-center text-muted-foreground text-sm mb-6">{{ eroare }}</p>

    <div *ngIf="trainers.length; else empty" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
      <article *ngFor="let t of trainers" class="bg-card border border-border rounded overflow-hidden card-hover">
        <div class="h-48 bg-secondary flex items-center justify-center">
          <i class="pi pi-user text-muted-foreground text-6xl"></i>
        </div>
        <div class="p-5">
          <h3 class="font-heading text-lg font-semibold">{{ numeComplet(t) }}</h3>
          <p class="text-primary text-sm font-medium mb-3">{{ t.specialitate }}</p>
          <p class="text-xs text-muted-foreground mb-2">Status: {{ t.activ ? 'Activ' : 'Inactiv' }}</p>
          <div class="flex flex-wrap gap-1.5">
            <span *ngFor="let s of specialitati(t)" class="badge text-[10px]">{{ s }}</span>
          </div>
        </div>
      </article>
    </div>

    <ng-template #empty>
      <div class="bg-card border border-border rounded p-8 text-center max-w-2xl mx-auto">
        <p class="text-muted-foreground">Nu exista antrenori activi momentan.</p>
      </div>
    </ng-template>
  </div>
</section>
