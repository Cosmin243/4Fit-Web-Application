<section class="py-20">
  <div class="container">
    <div class="text-center mb-14">
      <p class="section-eyebrow">Tarife</p>
      <h1 class="text-4xl md:text-5xl font-bold">Alege abonamentul potrivit</h1>
      <p class="text-muted-foreground mt-4 max-w-2xl mx-auto">Planuri flexibile pentru sală, bazin, clase și antrenamente personale.</p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <article *ngFor="let plan of plans" [id]="plan.anchor" class="rounded border p-8 flex flex-col card-hover" [ngClass]="plan.highlight ? 'bg-primary/10 border-primary' : 'bg-card border-border'">
        <span class="badge mb-4 w-fit">{{ plan.category }}</span>
        <h2 class="font-heading text-2xl font-semibold mb-4">{{ plan.name }}</h2>
        <div class="mb-6">
          <span class="text-5xl font-heading font-bold text-primary">{{ plan.price }}</span>
          <span class="text-muted-foreground ml-1 text-sm">lei{{ plan.per }}</span>
        </div>
        <ul class="space-y-3 mb-8 flex-1">
          <li *ngFor="let feature of plan.features" class="flex items-start gap-2 text-sm text-secondary-foreground">
            <i class="pi pi-check text-primary text-xs mt-1 shrink-0"></i>
            {{ feature }}
          </li>
        </ul>
        <a routerLink="/contact" class="btn w-full" [ngClass]="plan.highlight ? 'btn-primary' : 'btn-outline'">Cere detalii</a>
      </article>
    </div>
  </div>
</section>
