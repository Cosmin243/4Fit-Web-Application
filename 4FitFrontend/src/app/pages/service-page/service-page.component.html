<div>
  <section class="relative h-[40vh] overflow-hidden">
    <img [src]="page.image" [alt]="page.title" class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0 hero-overlay"></div>
    <div class="relative z-10 h-full flex items-center justify-center">
      <div class="text-center">
        <p class="text-primary font-heading tracking-widest text-sm mb-2">{{ page.eyebrow }}</p>
        <h1 class="text-4xl md:text-5xl font-bold">{{ page.title }}</h1>
      </div>
    </div>
  </section>

  <section class="py-16">
    <div class="container max-w-5xl">
      <p class="text-muted-foreground text-lg mb-12 max-w-2xl mx-auto text-center">{{ page.description }}</p>
      <div class="grid md:grid-cols-3 gap-6 mb-16">
        <article *ngFor="let item of page.features" class="bg-card border border-border rounded p-6">
          <i [class]="item.icon + ' text-primary text-3xl mb-3 block'"></i>
          <h3 class="font-heading text-lg font-semibold mb-2">{{ item.title }}</h3>
          <p class="text-sm text-muted-foreground">{{ item.desc }}</p>
        </article>
      </div>

      <h2 class="text-2xl font-bold mb-8 text-center">{{ page.featureTitle }}</h2>
      <div class="grid md:grid-cols-3 gap-6 max-w-4xl mx-auto">
        <article *ngFor="let plan of page.plans" class="rounded border p-8 flex flex-col" [ngClass]="plan.highlight ? 'bg-primary/10 border-primary' : 'bg-card border-border'">
          <h3 class="font-heading text-xl font-semibold mb-4">{{ plan.name }}</h3>
          <div class="mb-6">
            <span class="text-4xl font-heading font-bold text-primary">{{ plan.price }}</span>
            <span class="text-muted-foreground ml-1 text-sm">lei{{ plan.per }}</span>
          </div>
          <ul class="space-y-3 mb-8 flex-1">
            <li *ngFor="let feature of plan.features" class="flex items-start gap-2 text-sm text-secondary-foreground">
              <i class="pi pi-check text-primary text-xs mt-1 shrink-0"></i>
              {{ feature }}
            </li>
          </ul>
          <a [routerLink]="['/tarife']" [fragment]="page.anchor" class="btn w-full" [ngClass]="plan.highlight ? 'btn-primary' : 'btn-outline'">Cumpara</a>
        </article>
      </div>
    </div>
  </section>
</div>
