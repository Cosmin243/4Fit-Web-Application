<section class="py-20">
  <div class="container max-w-4xl">
    <p class="text-primary font-heading tracking-widest text-sm mb-2">Clase</p>
    <h1 class="text-4xl md:text-5xl font-bold mb-6">{{ page.title }}</h1>
    <p class="text-muted-foreground text-lg mb-12 max-w-2xl">{{ page.description }}</p>

    <div class="grid md:grid-cols-3 gap-6 mb-12">
      <article *ngFor="let item of page.cards" class="bg-card border border-border rounded p-6">
        <i [class]="item.icon + ' text-primary text-3xl mb-3 block'"></i>
        <h3 class="font-heading text-lg font-semibold mb-2">{{ item.title }}</h3>
        <p class="text-sm text-muted-foreground">{{ item.desc }}</p>
      </article>
    </div>

    <div class="bg-card border border-border rounded p-6 mb-8">
      <h3 class="font-heading text-lg font-semibold mb-2">Program cursuri</h3>
      <p *ngFor="let row of page.schedule" class="text-sm text-muted-foreground">{{ row }}</p>
    </div>
    <a routerLink="/orar-clase" class="btn btn-primary">Inscrie-te din orar</a>
  </div>
</section>
